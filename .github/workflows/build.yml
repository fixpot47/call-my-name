name: Build Call My Name

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - run: gradle build --stacktrace
      - run: |
          mkdir -p dist
          cp build/libs/call-my-name-1.1.0.jar dist/call-my-name.jar
      - uses: actions/upload-artifact@v4
        with:
          name: call-my-name-1.1.0-26.3
          path: dist/call-my-name.jar
